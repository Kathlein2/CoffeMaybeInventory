<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Maybe Inventory System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="view-login" class="page-view login-view active">
    <div class="login-card">
      <div class="brand-header">
        <span style="font-size: 2.2rem;">☕</span>
        <h1>COFFEE MAYBE</h1>
        <p>INVENTORY MANAGER PORTAL</p>
      </div>

      <form id="login-step-1" onsubmit="event.preventDefault(); handleLoginSubmit();">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>
        <button type="submit" id="login-btn" class="btn-sign-in">LOGIN</button>
      </form>

      <form id="login-step-2" class="hidden" onsubmit="event.preventDefault(); handleVerifyOtpSubmit();">
        <div class="form-group">
          <label for="login-otp">Verification Code</label>
          <input type="text" id="login-otp" placeholder="Enter 6-digit OTP">
        </div>
        <button type="button" class="btn-sign-in" onclick="handleVerifyOtpSubmit()">VERIFY OTP</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="view-dashboard" class="page-view app-layout">
    <aside class="sidebar">
      <div>
        <div class="brand-header">
          <span style="font-size: 2rem;">☕</span>
          <h1>Coffee Maybe</h1>
          <p>INVENTORY SYSTEM</p>
        </div>
        <ul style="list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 20px;">
          <li><button class="btn-sign-in" onclick="showView('view-dashboard')">📊 Dashboard</button></li>
          <li><button class="btn-sign-in" onclick="showView('view-inventory')">📦 Inventory</button></li>
        </ul>
      </div>
      <button class="btn-sign-in" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">
      <h2>Welcome, Manager! ☕</h2>
      <p>Your dashboard is ready.</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
